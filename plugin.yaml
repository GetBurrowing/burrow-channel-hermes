name: startup-suite-platform
label: Burrow
kind: platform
version: 0.3.1
description: >
  Burrow federation adapter for Hermes Agent. Joins the Burrow runtime
  socket as a federated runtime, delivers Burrow attention events (mentions,
  DMs, task dispatches) into Hermes sessions, and posts replies, typing,
  progressive reveal and attachments back to the Burrow space.
author: Burrow
# No requires_env, on purpose. Hermes's `hermes plugins install` (which
# update.sh runs) prompts for every requires_env name unset in
# $HERMES_HOME/.env (hermes_cli/plugins_cmd.py _missing_env_specs), and it
# takes one spelling per entry. Listing BURROW_URL would prompt every host
# still on the SUITE_ names; listing SUITE_URL would tell a new host to set the
# deprecated name. install.sh writes BURROW_URL, BURROW_RUNTIME_ID and
# BURROW_RUNTIME_TOKEN_FILE (and their SUITE_ twins) before it installs, and
# the plugin declares the spellings a host sets to the gateway at load
# (register() required_env). Both spellings stay listed below, so
# `hermes config` still shows them.
requires_env: []
# The token is NOT an env setting: a value in $HERMES_HOME/.env is copied
# into the gateway's os.environ on every turn and inherited by children
# spawned without a scrub. install.sh writes it to a 0600 file under
# $HERMES_HOME/mcp-tokens/ and puts only the path in BURROW_RUNTIME_TOKEN_FILE.
# `password` masks a value in `hermes config`; `secret` masks any prompt for it
# (hermes_cli/plugins_cmd_install.py _prompt_plugin_env_vars).
optional_env:
  - name: BURROW_URL
    description: "Burrow runtime socket URL, e.g. wss://burrow.example.com/runtime/ws"
    prompt: "Burrow runtime socket URL"
    password: false
  - name: SUITE_URL
    description: "DEPRECATED spelling of BURROW_URL, read only when BURROW_URL is unset. Burrow runtime socket URL, e.g. wss://burrow.example.com/runtime/ws"
    prompt: "Burrow runtime socket URL (deprecated name)"
    password: false
  - name: BURROW_RUNTIME_ID
    description: "The federated runtime id registered for this agent in Burrow"
    prompt: "Burrow runtime id"
    password: false
  - name: SUITE_RUNTIME_ID
    description: "DEPRECATED spelling of BURROW_RUNTIME_ID, read only when BURROW_RUNTIME_ID is unset. The federated runtime id registered for this agent in Burrow"
    prompt: "Burrow runtime id (deprecated name)"
    password: false
  - name: BURROW_RUNTIME_TOKEN_FILE
    description: "Path of the 0600 file holding the Burrow runtime token (install.sh writes it)"
    prompt: "Burrow runtime token file"
    password: false
  - name: SUITE_RUNTIME_TOKEN_FILE
    description: "DEPRECATED spelling of BURROW_RUNTIME_TOKEN_FILE, read only when BURROW_RUNTIME_TOKEN_FILE is unset. Path of the 0600 file holding the Burrow runtime token (install.sh writes it)"
    prompt: "Burrow runtime token file (deprecated name)"
    password: false
  - name: BURROW_RUNTIME_TOKEN
    description: "LEGACY: the runtime token itself. Kept out of os.environ only when it is exported by the launcher; in .env Hermes re-copies it every turn. Use BURROW_RUNTIME_TOKEN_FILE."
    prompt: "Burrow runtime token (legacy; prefer the token file)"
    password: true
    secret: true
  - name: SUITE_RUNTIME_TOKEN
    description: "DEPRECATED spelling of BURROW_RUNTIME_TOKEN, read only when BURROW_RUNTIME_TOKEN is unset. LEGACY: the runtime token itself. Kept out of os.environ only when it is exported by the launcher; in .env Hermes re-copies it every turn. Use BURROW_RUNTIME_TOKEN_FILE."
    prompt: "Burrow runtime token (legacy; prefer the token file) (deprecated name)"
    password: true
    secret: true
  - name: BURROW_ALLOWED_USERS
    description: "Comma-separated Burrow display names allowed to drive the agent (suite-system covers task dispatches)"
    prompt: "Allowed Burrow users (comma-separated)"
    password: false
  - name: SUITE_ALLOWED_USERS
    description: "DEPRECATED spelling of BURROW_ALLOWED_USERS, read only when BURROW_ALLOWED_USERS is unset. Comma-separated Burrow display names allowed to drive the agent (suite-system covers task dispatches)"
    prompt: "Allowed Burrow users (comma-separated) (deprecated name)"
    password: false
  - name: BURROW_ALLOW_ALL_USERS
    description: "Accept every message Burrow delivers (Burrow already limits delivery to spaces the agent is in)"
    prompt: "Allow all Burrow users? (true/false)"
    password: false
  - name: SUITE_ALLOW_ALL_USERS
    description: "DEPRECATED spelling of BURROW_ALLOW_ALL_USERS, read only when BURROW_ALLOW_ALL_USERS is unset. Accept every message Burrow delivers (Burrow already limits delivery to spaces the agent is in)"
    prompt: "Allow all Burrow users? (true/false) (deprecated name)"
    password: false
  - name: BURROW_HOME_CHANNEL
    description: "Burrow space id for cron / notification delivery"
    prompt: "Home space id (or empty)"
    password: false
  - name: SUITE_HOME_CHANNEL
    description: "DEPRECATED spelling of BURROW_HOME_CHANNEL, read only when BURROW_HOME_CHANNEL is unset. Burrow space id for cron / notification delivery"
    prompt: "Home space id (or empty) (deprecated name)"
    password: false
  - name: BURROW_AGENT_ID
    description: "This agent's Burrow agent id, used to drop its own messages if Burrow echoes them"
    prompt: "Burrow agent id (optional)"
    password: false
  - name: SUITE_AGENT_ID
    description: "DEPRECATED spelling of BURROW_AGENT_ID, read only when BURROW_AGENT_ID is unset. This agent's Burrow agent id, used to drop its own messages if Burrow echoes them"
    prompt: "Burrow agent id (optional) (deprecated name)"
    password: false
  - name: BURROW_TRUSTED_USER_IDS
    description: "Comma-separated Burrow USER ids (UUIDs, not names) whose messages are delivered as owner instructions instead of untrusted content. Empty trusts nobody. Never enables Hermes /commands."
    prompt: "Trusted Burrow user ids (comma-separated, or empty)"
    password: false
  - name: SUITE_TRUSTED_USER_IDS
    description: "DEPRECATED spelling of BURROW_TRUSTED_USER_IDS, read only when BURROW_TRUSTED_USER_IDS is unset. Comma-separated Burrow USER ids (UUIDs, not names) whose messages are delivered as owner instructions instead of untrusted content. Empty trusts nobody. Never enables Hermes /commands."
    prompt: "Trusted Burrow user ids (comma-separated, or empty) (deprecated name)"
    password: false
  - name: BURROW_RECONNECT_MIN_MS
    description: "First reconnect delay in ms (default 1000)"
    prompt: "Reconnect min ms"
    password: false
  - name: SUITE_RECONNECT_MIN_MS
    description: "DEPRECATED spelling of BURROW_RECONNECT_MIN_MS, read only when BURROW_RECONNECT_MIN_MS is unset. First reconnect delay in ms (default 1000)"
    prompt: "Reconnect min ms (deprecated name)"
    password: false
  - name: BURROW_RECONNECT_MAX_MS
    description: "Reconnect delay cap in ms (default 30000)"
    prompt: "Reconnect max ms"
    password: false
  - name: SUITE_RECONNECT_MAX_MS
    description: "DEPRECATED spelling of BURROW_RECONNECT_MAX_MS, read only when BURROW_RECONNECT_MAX_MS is unset. Reconnect delay cap in ms (default 30000)"
    prompt: "Reconnect max ms (deprecated name)"
    password: false
  - name: BURROW_RECONNECT_JITTER
    description: "Fraction of each reconnect delay removed at random, 0..1 (default 0.2)"
    prompt: "Reconnect jitter"
    password: false
  - name: SUITE_RECONNECT_JITTER
    description: "DEPRECATED spelling of BURROW_RECONNECT_JITTER, read only when BURROW_RECONNECT_JITTER is unset. Fraction of each reconnect delay removed at random, 0..1 (default 0.2)"
    prompt: "Reconnect jitter (deprecated name)"
    password: false
  - name: BURROW_STALE_TRAFFIC_MS
    description: "Force a reconnect after this long with no socket traffic, in ms (default 120000)"
    prompt: "Stale traffic ms"
    password: false
  - name: SUITE_STALE_TRAFFIC_MS
    description: "DEPRECATED spelling of BURROW_STALE_TRAFFIC_MS, read only when BURROW_STALE_TRAFFIC_MS is unset. Force a reconnect after this long with no socket traffic, in ms (default 120000)"
    prompt: "Stale traffic ms (deprecated name)"
    password: false
