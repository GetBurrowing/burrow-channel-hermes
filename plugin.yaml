name: startup-suite-platform
label: Startup Suite
kind: platform
version: 0.1.0
description: >
  Startup Suite federation adapter for Hermes Agent. Joins the Suite runtime
  socket as a federated runtime, delivers Suite attention events (mentions,
  DMs, task dispatches) into Hermes sessions, and posts replies, typing,
  progressive reveal and attachments back to the Suite space.
author: Startup Suite
requires_env:
  - name: SUITE_URL
    description: "Suite runtime socket URL, e.g. wss://suite.example.com/runtime/ws"
    prompt: "Suite runtime socket URL"
    password: false
  - name: SUITE_RUNTIME_ID
    description: "The federated runtime id registered for this agent in Suite"
    prompt: "Suite runtime id"
    password: false
  # The token is NOT an env setting: a value in $HERMES_HOME/.env is copied
  # into the gateway's os.environ on every turn and inherited by children
  # spawned without a scrub. install.sh writes it to a 0600 file under
  # $HERMES_HOME/mcp-tokens/ and puts only the path here.
  - name: SUITE_RUNTIME_TOKEN_FILE
    description: "Path of the 0600 file holding the Suite runtime token (install.sh writes it)"
    prompt: "Suite runtime token file"
    password: false
optional_env:
  - name: SUITE_RUNTIME_TOKEN
    description: "LEGACY: the runtime token itself. Kept out of os.environ only when it is exported by the launcher; in .env Hermes re-copies it every turn. Use SUITE_RUNTIME_TOKEN_FILE."
    prompt: "Suite runtime token (legacy; prefer the token file)"
    # `password` masks it in `hermes config`; `secret` masks any prompt for it
    # (hermes_cli/plugins_cmd_install.py _prompt_plugin_env_vars).
    password: true
    secret: true
  - name: SUITE_ALLOWED_USERS
    description: "Comma-separated Suite display names allowed to drive the agent (suite-system covers task dispatches)"
    prompt: "Allowed Suite users (comma-separated)"
    password: false
  - name: SUITE_ALLOW_ALL_USERS
    description: "Accept every message Suite delivers (Suite already limits delivery to spaces the agent is in)"
    prompt: "Allow all Suite users? (true/false)"
    password: false
  - name: SUITE_HOME_CHANNEL
    description: "Suite space id for cron / notification delivery"
    prompt: "Home space id (or empty)"
    password: false
  - name: SUITE_AGENT_ID
    description: "This agent's Suite agent id, used to drop its own messages if Suite echoes them"
    prompt: "Suite agent id (optional)"
    password: false
  - name: SUITE_TRUSTED_USER_IDS
    description: "Comma-separated Suite USER ids (UUIDs, not names) whose messages are delivered as owner instructions instead of untrusted content. Empty trusts nobody. Never enables Hermes /commands."
    prompt: "Trusted Suite user ids (comma-separated, or empty)"
    password: false
  - name: SUITE_RECONNECT_MIN_MS
    description: "First reconnect delay in ms (default 1000)"
    prompt: "Reconnect min ms"
    password: false
  - name: SUITE_RECONNECT_MAX_MS
    description: "Reconnect delay cap in ms (default 30000)"
    prompt: "Reconnect max ms"
    password: false
  - name: SUITE_RECONNECT_JITTER
    description: "Fraction of each reconnect delay removed at random, 0..1 (default 0.2)"
    prompt: "Reconnect jitter"
    password: false
  - name: SUITE_STALE_TRAFFIC_MS
    description: "Force a reconnect after this long with no socket traffic, in ms (default 120000)"
    prompt: "Stale traffic ms"
    password: false
